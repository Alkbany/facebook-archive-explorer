name: Cleanup merged UI branch

on:
  push:
    branches:
      - maintenance/delete-merged-beta-ui

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify main contains the complete branch history, then delete the obsolete branch
        uses: actions/github-script@v9
        with:
          script: |
            const target = 'beta/ui-redesign';
            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: target,
              head: 'main'
            });
            if (!['ahead', 'identical'].includes(comparison.data.status) || comparison.data.behind_by !== 0) {
              throw new Error(`Refusing to delete ${target}: main is not a complete superset (status=${comparison.data.status}, behind_by=${comparison.data.behind_by}).`);
            }
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${target}`
            });
            const triggerBranch = 'maintenance/delete-merged-beta-ui';
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${triggerBranch}`
            });
