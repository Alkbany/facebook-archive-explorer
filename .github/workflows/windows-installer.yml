name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'electron.vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/windows-installer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Validate release signature script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/verify-windows-signatures.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            throw 'Windows signature verification script has PowerShell syntax errors.'
          }
      - name: Build Windows NSIS installer
        run: npm run package:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Require trusted signatures for version releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'facebook-archive-explorer-windows' || 'facebook-archive-explorer-windows-test' }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: facebook-archive-explorer-windows
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.exe
          fail_on_unmatched_files: true
