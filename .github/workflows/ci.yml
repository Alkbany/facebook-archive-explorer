name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # This is a Windows desktop application. Keep validation on Windows too;
    # the separate Windows installer workflow owns packaging and NSIS smoke tests.
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build Electron application
        run: npm run build
