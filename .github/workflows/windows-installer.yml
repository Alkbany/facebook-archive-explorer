name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'electron.vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/windows-installer.yml'
      - 'docs/CODE-SIGNING.md'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'electron.vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/windows-installer.yml'
      - 'docs/CODE-SIGNING.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Validate release signature script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/verify-windows-signatures.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            throw 'Windows signature verification script has PowerShell syntax errors.'
          }
      - name: Require a signing certificate for version releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw 'A trusted Windows code-signing certificate is required before a version release can be built.'
          }
      - name: Build Windows NSIS installer
        run: npm run package:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify trusted signatures before publishing installer
        id: verify-signatures
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            if ($env:GITHUB_REF -like 'refs/tags/v*') {
              throw 'A trusted Windows code-signing certificate is required for version releases.'
            }
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Warning 'No trusted signing certificate is configured. The installer will not be uploaded because Smart App Control may block an unsigned build.'
          }
          else {
            ./scripts/verify-windows-signatures.ps1
            "signed=true" >> $env:GITHUB_OUTPUT
          }
      - name: Upload signed installer artifact
        if: steps.verify-signatures.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'facebook-archive-explorer-windows' || 'facebook-archive-explorer-windows-test' }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: facebook-archive-explorer-windows
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.exe
          fail_on_unmatched_files: true
